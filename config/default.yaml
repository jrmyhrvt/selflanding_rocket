simulation:
  t0: 0.0
  tf: 10.0
  dt: 0.01
  seed: 12345
  enable_logging: true

rocket:
  dry_mass_kg: 500.0
  initial_fuel_kg: 100.0
  cg_offset_m: [0.0, 0.0, 0.0]
  inertia_body_kgm2: [[2000.0, 0.0, 0.0], [0.0, 2000.0, 0.0], [0.0, 0.0, 500.0]]

initial_conditions:
  position_m: [0.0, 0.0, 100.0]  # [x,y,z] up positive
  velocity_m_s: [0.0, 0.0, 0.0]
  orientation_q: [1.0, 0.0, 0.0, 0.0]  # [w,x,y,z]
  angular_velocity_rad_s: [0.0, 0.0, 0.0]

environment:
  wind_base_m_s: [0.0, 0.0, 0.0]
  wind_gust_amp_m_s: 0.0
  wind_gust_freq_hz: 1.0

sensors:
  acc_std_m_s2: 0.1
  gyro_std_rad_s: 0.01
  pos_std_m: 1.0
  vel_std_m_s: 0.1
  fuel_std_kg: 2.0
