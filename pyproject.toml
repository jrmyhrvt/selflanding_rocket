[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selflanding-rocket"
version = "0.1.0"
description = "Modular 3D rocket simulation with state estimation & monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "state*", "physics*", "atmosphere*", "mass_model*", "sensors*", "estimator*", "system_logic*", "simulation*", "visualization*", "evaluation*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
